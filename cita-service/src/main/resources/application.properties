spring.application.name=cita-service
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.r2dbc.url=r2dbc:mssql://localhost:1433/HOSPITAL_VIDA_SALUD?trustServerCertificate=true
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# URL configurable para el servicio de pacientes (usa localhost como valor predeterminado).
hospital.services.paciente-url=${PACIENTE_SERVICE_URL:http://localhost:8081}
